# Release pipeline for desarray.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# builds a Release, signs it with Developer ID, notarizes + staples it, publishes a GitHub
# Release with desarray-<version>.zip, then bumps Casks/desarray.rb in atpugvaraa/homebrew-atpugvaraa.
# Tags with a suffix (v0.2.0-beta.1) become GitHub pre-releases and do NOT touch the cask.
#
# "Run workflow" (workflow_dispatch) = dry run: unsigned build + tests, zip uploaded as an
# artifact. No secrets needed, nothing published. Use it to check the build still works on CI.
#
# Secrets (see docs/RELEASING.md):
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD   Developer ID Application cert (.p12)
#   NOTARY_KEY_P8_BASE64, NOTARY_KEY_ID, NOTARY_ISSUER_ID App Store Connect API key for notarytool
#   HOMEBREW_TAP_TOKEN                                    fine-grained PAT: contents:write on the tap

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAP_REPO: atpugvaraa/homebrew-atpugvaraa

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Resolve version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
            PUBLISH=true
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            PUBLISH=false
          fi
          [[ "$V" == *-* ]] && PRERELEASE=true || PRERELEASE=false
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "zip=desarray-$V.zip" >> "$GITHUB_OUTPUT"
          echo "Version $V (publish=$PUBLISH, prerelease=$PRERELEASE)"

      - name: Check release secrets
        if: steps.v.outputs.publish == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PW: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          TAP: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          missing=()
          [[ -n "$P12" ]]    || missing+=(DEVELOPER_ID_P12_BASE64)
          [[ -n "$P12_PW" ]] || missing+=(DEVELOPER_ID_P12_PASSWORD)
          [[ -n "$KEY" ]]    || missing+=(NOTARY_KEY_P8_BASE64)
          [[ -n "$KEY_ID" ]] || missing+=(NOTARY_KEY_ID)
          [[ -n "$ISSUER" ]] || missing+=(NOTARY_ISSUER_ID)
          [[ -n "$TAP" || "${{ steps.v.outputs.prerelease }}" == "true" ]] || missing+=(HOMEBREW_TAP_TOKEN)
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets: ${missing[*]} — see docs/RELEASING.md"; exit 1
          fi

      - name: Unit tests
        run: swift test --package-path Packages/DesarrayCore

      - name: Import Developer ID certificate
        if: steps.v.outputs.publish == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PW: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PW" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046 # split on purpose: one argument per existing keychain
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" \
            || { echo "::error::No 'Developer ID Application' identity in the .p12"; exit 1; }

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PUBLISH: ${{ steps.v.outputs.publish }}
        run: |
          brew install xcodegen
          xcodegen generate
          if [[ "$PUBLISH" == "true" ]]; then
            SIGN=(CODE_SIGN_IDENTITY="Developer ID Application" OTHER_CODE_SIGN_FLAGS="--timestamp")
          else
            SIGN=(CODE_SIGN_IDENTITY="-")
          fi
          xcodebuild -project desarray.xcodeproj -scheme desarray -configuration Release \
            -derivedDataPath build -destination 'platform=macOS' \
            MARKETING_VERSION="${VERSION%%-*}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${SIGN[@]}" build | tail -n 30
          APP=build/Build/Products/Release/desarray.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"

      - name: Notarize and staple
        if: steps.v.outputs.publish == 'true'
        env:
          KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          APP=build/Build/Products/Release/desarray.app
          echo "$KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"
          STATUS=$(plutil -extract status raw "$RUNNER_TEMP/notary.json" 2>/dev/null || python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [[ "$STATUS" != "Accepted" ]]; then
            ID=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/notary.p8" --key-id "$KEY_ID" --issuer "$ISSUER"
            echo "::error::Notarization $STATUS"; exit 1
          fi
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

      - name: Package
        id: pkg
        env:
          ZIP: ${{ steps.v.outputs.zip }}
        run: |
          ditto -c -k --keepParent build/Build/Products/Release/desarray.app "$ZIP"
          SHA=$(shasum -a 256 "$ZIP" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "$ZIP  $SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.v.outputs.zip }}
          path: ${{ steps.v.outputs.zip }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          ZIP: ${{ steps.v.outputs.zip }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          FLAGS=(--title "desarray. $VERSION" --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          NOTES=$'### Install\n\n```bash\nbrew install --cask atpugvaraa/atpugvaraa/desarray\n```\n\nOr download `'"$ZIP"$'` below, unzip, and move **desarray.app** to Applications. Signed with Developer ID and notarized by Apple.\n\nSHA-256: `'"$SHA"'`'
          gh release create "$GITHUB_REF_NAME" "$ZIP" "${FLAGS[@]}" --notes "$NOTES"

      - name: Bump Homebrew cask
        if: steps.v.outputs.publish == 'true' && steps.v.outputs.prerelease == 'false'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
          SHA: ${{ steps.pkg.outputs.sha256 }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/desarray.rb <<EOF
          cask "desarray" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/atpugvaraa/desarray/releases/download/v#{version}/desarray-#{version}.zip"
            name "desarray."
            desc "X-ray any interface: element boxes, spacing, insets and sizes"
            homepage "https://github.com/atpugvaraa/desarray"

            depends_on macos: :sonoma

            app "desarray.app"

            zap trash: "~/Library/Preferences/app.desarray.mac.plist"
          end
          EOF
          brew style tap/Casks/desarray.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/desarray.rb
          git diff --cached --quiet && { echo "Cask already at $VERSION"; exit 0; }
          git commit -m "desarray $VERSION"
          git push

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
